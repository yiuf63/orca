name: Personal Main Release

on:
  push:
    branches:
      - personal/main
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: personal-main-release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
            artifact: orca-windows-x64
            globs: |
              dist/orca-windows-setup.exe
              dist/orca-windows-setup.exe.blockmap
          # Why: the Computer Use Swift package requires Swift 6, which only
          # ships on macOS 15 images (macos-13/14 default to Swift 5.10). The
          # electron-builder config targets both x64 and arm64, so one job
          # produces both macOS architectures like the official pipeline.
          - os: macos-15
            args: --mac
            artifact: orca-macos
            native: true
            globs: |
              dist/orca-macos-*
              dist/Orca-*.zip
              dist/*.blockmap
          - os: ubuntu-22.04
            args: --linux --x64
            artifact: orca-linux-x64
            globs: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install native build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 zlib1g-dev zsh

      # Why: pnpm's bundled node-gyp ships gyp_main.py without execute
      # permission, which breaks native module builds on Linux runners.
      - name: Use external node-gyp to avoid pnpm's bundled copy (Linux only)
        if: runner.os == 'Linux'
        run: |
          npm install -g node-gyp@11.5.0
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prefer-frozen-lockfile=false

      - name: Build desktop bundle
        run: pnpm run build:desktop

      # Why: macOS packaging needs the Computer Use helper app and notification
      # status binary compiled before electron-builder runs; other platforms
      # either use checked-in resources or a launcher built by electron-builder.
      - name: Build native helpers
        if: matrix.native
        run: pnpm run build:native

      - name: Package
        # Why: dmgbuild's hdiutil detach is flaky on shared runners; retry once.
        run: |
          pnpm exec electron-builder --config config/electron-builder.config.cjs ${{ matrix.args }} --publish never || \
          pnpm exec electron-builder --config config/electron-builder.config.cjs ${{ matrix.args }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.globs }}
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          date="$(date +%Y%m%d)"
          short_sha="${SHA:0:7}"
          tag="v${version}-personal-${date}-${short_sha}"
          notes="Personal multi-platform build from personal/main @ ${SHA}

          Artifacts: Windows x64, macOS x64, macOS arm64, Linux x64.

          Unsigned personal build — macOS: right-click the app and choose Open; Windows: click through SmartScreen."
          gh release create "$tag" artifacts/* \
            --draft \
            --repo "$GITHUB_REPOSITORY" \
            --title "Personal build ${date} (${short_sha})" \
            --notes "$notes"
